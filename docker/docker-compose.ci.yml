services:
  neo4j:
    # No `image:` override here on purpose — it would pin CI back to the stock image and
    # leave the GDS code path untested, which is exactly how a GDS 1.x call survived in
    # this repo indefinitely: without the plugin the except-branch silently substitutes
    # the fallback, so the tests pass either way. CI builds the same GDS image the app
    # runs against, and inherits it from docker-compose.yml.
    environment:
      # GDS holds its projection in heap, so give it more room than the stock CI numbers.
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 256M

  app:
    image: cml-app-ci:latest
    environment:
      AUTH__API_KEY: test-key
      AUTH__ADMIN_API_KEY: test-key
      CML_API_KEY: test-key
      CML_ADMIN_API_KEY: test-key
      CML_BASE_URL: http://api:8000
      CML_TEST_URL: http://api:8000
      CML_TEST_API_KEY: test-key
      DEBUG: false
      EMBEDDING_INTERNAL__PROVIDER: mock
      FEATURES__USE_LLM_ENABLED: false
      LLM_STARTUP_VALIDATION_ENABLED: false
    command: sh -c "alembic upgrade head && pytest tests packages/py-cml/tests -v --tb=short -rs"

  api:
    image: cml-api-ci:latest
    environment:
      AUTH__API_KEY: test-key
      AUTH__ADMIN_API_KEY: test-key
      DEBUG: false
      EMBEDDING_INTERNAL__PROVIDER: mock
      FEATURES__USE_LLM_ENABLED: false
      LLM_STARTUP_VALIDATION_ENABLED: false
      LLM_STARTUP_VALIDATE_IN_CI: false
